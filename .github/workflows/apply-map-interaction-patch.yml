name: Apply map interaction patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-map-interaction-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_map_interaction.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "ui: add clickable map markers and profile company picker"
          git push
